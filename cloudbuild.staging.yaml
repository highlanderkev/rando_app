# Google Cloud Build – Flutter Android APK build + Firebase App Distribution staging deployment.
#
# This file is identical to cloudbuild.yaml except it distributes to the "staging-testers"
# group instead of "production-testers".
#
# One-time setup:
#   Follow the same checklist in cloudbuild.yaml (secrets, IAM, APIs).
#
#   Create a Cloud Build trigger for staging (push to main):
#        gcloud builds triggers create github \
#          --repo-name=rando_app \
#          --repo-owner=highlanderkev \
#          --branch-pattern="^main$" \
#          --build-config=cloudbuild.staging.yaml \
#          --project=rando-app-highlanderkev

substitutions:
  _FIREBASE_PROJECT_ID: rando-app-highlanderkev
  # Firebase App Distribution group to distribute the staging APK to
  _DISTRIBUTION_GROUP: staging-testers

steps:
  # Write Firebase configuration to .env from Secret Manager
  - name: 'ubuntu'
    id: 'create-env'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        printf '%s\n' \
          "FIREBASE_ANDROID_API_KEY=$$FIREBASE_ANDROID_API_KEY" \
          "FIREBASE_APP_ID=$$FIREBASE_APP_ID" \
          "FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_MESSAGING_SENDER_ID" \
          "FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID" \
          "FIREBASE_STORAGE_BUCKET=$$FIREBASE_STORAGE_BUCKET" \
          > .env
    secretEnv:
      - FIREBASE_ANDROID_API_KEY
      - FIREBASE_APP_ID
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET

  # Install pub dependencies
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'pub-get'
    entrypoint: 'flutter'
    args: ['pub', 'get']

  # Build Flutter Android APK (release mode)
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'build-apk'
    entrypoint: 'flutter'
    args: ['build', 'apk', '--release']

  # Distribute APK via Firebase App Distribution to staging testers
  - name: 'node:lts-slim'
    id: 'distribute'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install --global --quiet firebase-tools
        firebase appdistribution:distribute \
          build/app/outputs/flutter-apk/app-release.apk \
          --app "$$FIREBASE_APP_ID" \
          --groups "$_DISTRIBUTION_GROUP" \
          --project "$_FIREBASE_PROJECT_ID" \
          --token "$$FIREBASE_CI_TOKEN"
    secretEnv:
      - FIREBASE_APP_ID
      - FIREBASE_CI_TOKEN

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_ANDROID_API_KEY/versions/latest
      env: FIREBASE_ANDROID_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_APP_ID/versions/latest
      env: FIREBASE_APP_ID
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
      env: FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_CI_TOKEN/versions/latest
      env: FIREBASE_CI_TOKEN

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-builds/android/$BUILD_ID'
    paths:
      - 'build/app/outputs/flutter-apk/app-release.apk'

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
