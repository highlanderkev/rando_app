# Rolls back the live Firebase Hosting site to a previously released version.
# Trigger this workflow manually and provide the release tag (e.g. v1.2.3) to redeploy.

name: Rollback Firebase Hosting live to a previous release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to roll back to (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  deployments: write
  checks: write
  statuses: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag_name '${TAG}' does not match expected format vX.Y.Z" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag exists and check it out
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if ! git tag --list | grep -qxF "$TAG"; then
            echo "Error: tag '${TAG}' does not exist in the repository." >&2
            exit 1
          fi
          git checkout "$TAG"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create .env from secrets
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          {
            echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}"
            echo "FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            echo "FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            echo "FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
            echo "FIREBASE_WEB_AUTH_DOMAIN=${FIREBASE_WEB_AUTH_DOMAIN}"
            echo "FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}"
            echo "FIREBASE_WEB_MEASUREMENT_ID=${FIREBASE_WEB_MEASUREMENT_ID}"
          } > .env
      - run: flutter pub get
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANDO_APP_HIGHLANDERKEV }}'
          channelId: live
          projectId: rando-app-highlanderkev
