# Deploys to Firebase Hosting when a release branch is pushed, creates a git tag, and publishes release notes.
# Release branches follow the pattern: release/x.y.z (e.g. release/1.0.0)

name: Deploy to Firebase Hosting on release
'on':
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
      release_notes:
        description: 'Release notes'
        required: false
        default: ''

permissions:
  contents: write
  deployments: write
  checks: write
  statuses: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and release notes
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from branch name: release/x.y.z -> vx.y.z
            BRANCH="${{ github.ref_name }}"
            VERSION="v${BRANCH#release/}"
            NOTES="Release ${VERSION}"
          else
            VERSION="${{ inputs.tag_name }}"
            NOTES="${{ inputs.release_notes }}"
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
      - name: Create .env from secrets
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          {
            echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}"
            echo "FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            echo "FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            echo "FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
            echo "FIREBASE_WEB_AUTH_DOMAIN=${FIREBASE_WEB_AUTH_DOMAIN}"
            echo "FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}"
            echo "FIREBASE_WEB_MEASUREMENT_ID=${FIREBASE_WEB_MEASUREMENT_ID}"
          } > .env
      - run: flutter pub get
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANDO_APP_HIGHLANDERKEV }}'
          channelId: live
          projectId: rando-app-highlanderkev
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.release_info.outputs.version }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.release_info.outputs.version }} already exists — skipping creation."
          else
            gh release create "${{ steps.release_info.outputs.version }}" \
              --title "${{ steps.release_info.outputs.version }}" \
              --notes "${{ steps.release_info.outputs.notes }}" \
              --latest
          fi
