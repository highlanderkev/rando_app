# Deploys to Firebase Hosting when a release branch is pushed, creates a git tag, and publishes release notes.
# Release branches follow the pattern: release/x.y.z (e.g. release/1.0.0)

name: Deploy to Firebase Hosting on release
'on':
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
      release_notes:
        description: 'Release notes'
        required: false
        default: ''

permissions:
  contents: write
  deployments: write
  checks: write
  statuses: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and release notes
        id: release_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # Derive version from branch name: release/1.2.3 → v1.2.3
            VERSION="v${REF_NAME#release/}"
            NOTES="Release ${VERSION}"
          else
            VERSION="$INPUT_TAG_NAME"
            # Validate tag_name matches vX.Y.Z
            if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: tag_name '${VERSION}' does not match expected format vX.Y.Z" >&2
              exit 1
            fi
            NOTES="$INPUT_RELEASE_NOTES"
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NOTES_FILE=$(mktemp)
          printf '%s' "$NOTES" > "$NOTES_FILE"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
      - name: Create .env from secrets
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          {
            echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}"
            echo "FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            echo "FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            echo "FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
            echo "FIREBASE_WEB_AUTH_DOMAIN=${FIREBASE_WEB_AUTH_DOMAIN}"
            echo "FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}"
            echo "FIREBASE_WEB_MEASUREMENT_ID=${FIREBASE_WEB_MEASUREMENT_ID}"
          } > .env
      - run: flutter pub get
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANDO_APP_HIGHLANDERKEV }}'
          channelId: live
          projectId: rando-app-highlanderkev
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "GitHub release ${RELEASE_VERSION} already exists — skipping creation."
          else
            gh release create "$RELEASE_VERSION" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_VERSION" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
